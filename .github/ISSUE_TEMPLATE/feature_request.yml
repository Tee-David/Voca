name: Feature request
description: Propose an improvement to Voca
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading or contributor problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: local
    attributes:
      label: Local-first and privacy considerations
      description: Does this require a network service or send document-derived data off-device? If so, explain why and what should remain optional.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This does not require distributing copyrighted documents or circumventing DRM.
          required: true