name: Documentation issue
description: Report unclear, incorrect or missing Voca documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Where is the problem?
      description: Link or name the document/section if possible.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional. Explain what would have helped you as a reader or contributor.