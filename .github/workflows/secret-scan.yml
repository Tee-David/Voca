name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-source-scan:
    name: Tracked source scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject obvious private credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '.env' -o -name '.env.local' -o -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/signing files are tracked:'
            echo "$forbidden"
            exit 1
          fi

      - name: Scan tracked text for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          git grep -nEI '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key[[:space:]]*=|r2_secret_access_key[[:space:]]*=|groq_api_key[[:space:]]*=[[:space:]]*[^<${[:space:]]|nextauth_secret[[:space:]]*=[[:space:]]*[^<${[:space:]])' -- ':!*.lock' && {
            echo 'Potential credential material found. Review before release.'
            exit 1
          } || status=$?
          if [ "${status:-0}" -ne 1 ] && [ "${status:-0}" -ne 0 ]; then
            exit "$status"
          fi

# This workflow scans the checked-out candidate only. It does not make the
# private repository's historical credential exposure safe for publication.
# The first public release still requires a clean history and credential rotation.