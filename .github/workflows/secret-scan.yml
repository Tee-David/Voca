name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-source-scan:
    name: Tracked source scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject obvious private credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '.env' -o -name '.env.local' -o -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' -o -name '*.p12' -o -name '*.pfx' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/signing files are tracked:'
            echo "$forbidden"
            exit 1
          fi

      - name: Scan tracked source for private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!*.lock'; then
            echo 'Potential private key material found. Review before release.'
            exit 1
          fi

# This lightweight workflow catches accidentally tracked credential/signing
# files and private keys. It is not a substitute for the dedicated full-history
# secret scan required on the clean public release candidate.